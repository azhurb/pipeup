name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for reporting a Pipeup issue.

            Include the app version, operating system, steps to reproduce, and any relevant logs with API keys and personal dictation removed.
          pr-message: |
            Thanks for contributing to Pipeup.

            Please include the problem, resulting behavior, and checks you actually ran. See the [contributing guide](https://github.com/azhurb/pipeup/blob/main/CONTRIBUTING.md) for review expectations.
