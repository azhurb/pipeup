name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.14)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a release tag like v1.2.3."
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Sync version from tag
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Syncing version: $VERSION"

          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));c.version='$VERSION';fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2)+'\n');"

          node -e "const fs=require('fs');let c=fs.readFileSync('src-tauri/Cargo.toml','utf8');c=c.replace(/^version = \".*\"/m,'version = \"$VERSION\"');fs.writeFileSync('src-tauri/Cargo.toml',c);"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Import macOS code-signing certificate
        if: startsWith(matrix.platform, 'macos') && env.MACOS_CERT_P12_BASE64 != ''
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          CERT_PATH="${RUNNER_TEMP}/cert.p12"

          security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"

          printf '%s' "${MACOS_CERT_P12_BASE64}" | base64 --decode > "${CERT_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${MACOS_CERT_P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -A
          rm -f "${CERT_PATH}"

          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}" >/dev/null

          IDENTITY=$(security find-identity "${KEYCHAIN_PATH}" | awk '/"OpenTypeless Release"/ { print $2; exit }')
          if [[ -z "${IDENTITY}" ]]; then
            echo "::error::Imported certificate but could not locate signing identity in keychain"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"
          echo "Imported signing identity: ${IDENTITY}"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: 'Pipeup ${{ steps.release.outputs.tag }}'
          releaseBody: |
            ## Pipeup

            Voice input for desktop with your own speech and AI providers. A speech provider API key is required; AI processing is optional.

            See the [changelog](https://github.com/${{ github.repository }}/blob/${{ steps.release.outputs.tag }}/CHANGELOG.md) for changes in this release.

            ## Downloads

            Choose the macOS DMG for your processor (Apple Silicon or Intel), the Windows MSI, or the Linux AppImage/DEB below.

            macOS builds are self-signed, not notarized. After installing a trusted download in Applications, run `xattr -cr /Applications/Pipeup.app` if macOS blocks opening it. Grant Microphone and Accessibility permissions when prompted.

            ## Upgrading from OpenTypeless or older Pipeup

            Pipeup now has a separate app identity and can be installed beside OpenTypeless. Quit the old app before first launch. Pipeup offers to import a copy of settings, history, dictionary, and available provider keys, or to start fresh. The old app and its data stay untouched. The import turns off Pipeup's Launch at Startup setting; enable it again if wanted. If both apps run, assign different keyboard shortcuts.

            On macOS, grant Microphone and Accessibility to the new Pipeup entry. The old OpenTypeless entry does not grant Pipeup permission. See [permission recovery](https://github.com/${{ github.repository }}/blob/${{ steps.release.outputs.tag }}/docs/references/troubleshooting.md#macos-accessibility-still-lists-opentypeless) if paste fails.

            ## Before publishing this draft

            The maintainer must add the release highlights, verified platforms, and known issues after completing the [release checks](https://github.com/${{ github.repository }}/blob/${{ steps.release.outputs.tag }}/docs/references/release-preparation.md). Remove this draft-only section before publication.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
